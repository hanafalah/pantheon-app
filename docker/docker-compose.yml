version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: pantheon-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pantheon-network

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: pantheon-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pantheon-network

  # Pantheon App Backend (uncomment after implementing pantheon-business)
  # pantheon-app:
  #   build:
  #     context: ..
  #     dockerfile: docker/Dockerfile
  #   container_name: pantheon-app
  #   environment:
  #     DATABASE_URL: postgresql://pantheon_app:pantheon_password@postgres:5432/pantheon
  #     RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
  #     JWT_SECRET: YXYlGIbJ65VGjQnETWX23iCvssXg7PJu
  #     APP_ENV: development
  #     RUST_LOG: info
  #   ports:
  #     - "8000:8000"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     rabbitmq:
  #       condition: service_healthy
  #   volumes:
  #     - ../config:/app/config:ro
  #   restart: unless-stopped
  #   networks:
  #     - pantheon-network

volumes:
  postgres_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  pantheon-network:
    driver: bridge
