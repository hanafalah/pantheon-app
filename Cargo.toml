[workspace]
members = [
    "rust-support",
    "rust-core",
    # Temporarily commented out until crates are created
    # "repositories/*",
    # "projects/*",
    # "groups/*",
    # "tenants/*",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Pantheon Team <hamzahnafalah@gmail.com>"]
license = "MIT"
repository = "https://github.com/hanafalah/pantheon-app"

[workspace.dependencies]
# Web Framework
actix-web = "4.4"
actix-cors = "0.7"
actix-files = "0.6"
actix-multipart = "0.6"

# Database
diesel = { version = "2.1", features = ["postgres", "uuid", "chrono", "r2d2"] }
diesel_migrations = "2.1"

# Connection Pooling
r2d2 = "0.8"

# Async Runtime
tokio = { version = "1.35", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# JWT Authentication
jsonwebtoken = "9.2"

# Password Hashing
bcrypt = "0.15"

# UUID
uuid = { version = "1.6", features = ["v4", "serde"] }

# Date & Time
chrono = { version = "0.4", features = ["serde"] }

# Configuration Management
config = "0.14"
dotenv = "0.15"

# Validation
validator = { version = "0.18", features = ["derive"] }

# Error Handling
anyhow = "1.0"
thiserror = "1.0"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-actix-web = "0.7"

# RabbitMQ / AMQP
lapin = "2.3"
async-trait = "0.1"

# OpenAPI / Swagger
utoipa = { version = "4.2", features = ["actix_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "6.0", features = ["actix-web"] }

# HTTP Client
reqwest = { version = "0.11", features = ["json"] }

# Testing
mockall = "0.12"
fake = "2.9"

# Performance
once_cell = "1.19"
parking_lot = "0.12"

# Utilities
regex = "1.10"
base64 = "0.21"
sha2 = "0.10"
rand = "0.8"
