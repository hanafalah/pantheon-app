# Entity-to-Connection Mapping Configuration
# This file defines which database connection each entity should use

# Format:
# [entity.EntityName]
# connection = "core" | "hq" | "group" | "tenant" | "cluster:cashier" | "cluster:scm"
# schema = "schema_name" (optional, for cluster databases)

# ============================================================================
# CORE DATABASE ENTITIES (pantheon)
# ============================================================================

[entity.User]
connection = "core"

[entity.UserReference]
connection = "core"

[entity.Tenant]
connection = "core"

[entity.Workspace]
connection = "core"

[entity.Domain]
connection = "core"

[entity.License]
connection = "core"

[entity.ModelHasLicense]
connection = "core"

[entity.Unicode]
connection = "core"

[entity.ApiAccess]
connection = "core"

[entity.Job]
connection = "core"

[entity.FailedJob]
connection = "core"

# Regional entities
[entity.Country]
connection = "core"

[entity.Province]
connection = "core"

[entity.District]
connection = "core"

[entity.Subdistrict]
connection = "core"

[entity.Village]
connection = "core"

